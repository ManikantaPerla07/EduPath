<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">EduPath — Personalized AI Learning Space</title>
  <desc id="desc">A dark blue and violet gradient banner with the EduPath wordmark, a learning-path motif, and labels for grounded tutoring, adaptive learning, and RAG.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a3a"/>
      <stop offset="0.55" stop-color="#202c63"/>
      <stop offset="1" stop-color="#35236d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c8cff"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9b8cff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#36c9df" stop-opacity=".04"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>
  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <circle cx="1030" cy="34" r="185" fill="#6675ff" opacity=".18" filter="url(#shadow)"/>
  <circle cx="1080" cy="290" r="170" fill="#25c5d9" opacity=".12" filter="url(#shadow)"/>
  <path d="M720 0 C850 68 900 15 1010 75 S1145 110 1200 50" fill="none" stroke="#9aa7ff" stroke-opacity=".14" stroke-width="2"/>
  <path d="M760 320 C870 250 930 296 1040 235 S1140 210 1200 260" fill="none" stroke="#74e0ea" stroke-opacity=".16" stroke-width="2"/>
  <g opacity=".6" fill="#c9d2ff">
    <circle cx="790" cy="60" r="3"/><circle cx="850" cy="110" r="2"/><circle cx="950" cy="42" r="3"/>
    <circle cx="1110" cy="102" r="2"/><circle cx="1150" cy="170" r="3"/><circle cx="1010" cy="260" r="2"/>
    <circle cx="880" cy="270" r="3"/><circle cx="760" cy="220" r="2"/>
  </g>
  <g transform="translate(78 72)">
    <rect x="0" y="0" width="76" height="76" rx="22" fill="url(#accent)"/>
    <path d="M18 19 Q38 12 58 19 V56 Q38 49 18 56 Z" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
    <path d="M38 18 V54 M25 30 H32 M44 30 H52 M25 41 H32 M44 41 H52" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".9"/>
    <circle cx="58" cy="18" r="6" fill="#77e2ef"/>
  </g>
  <text x="78" y="198" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="72" font-weight="800" letter-spacing="-2">EduPath</text>
  <text x="82" y="236" fill="#cbd5ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="500" letter-spacing="3">PERSONALIZED AI LEARNING SPACE</text>
  <g transform="translate(82 267)">
    <rect x="0" y="0" width="170" height="34" rx="17" fill="#ffffff" fill-opacity=".1" stroke="#d7ddff" stroke-opacity=".28"/>
    <text x="85" y="22" text-anchor="middle" fill="#e8ebff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">GROUNDED TUTORING</text>
    <rect x="182" y="0" width="156" height="34" rx="17" fill="#ffffff" fill-opacity=".1" stroke="#d7ddff" stroke-opacity=".28"/>
    <text x="260" y="22" text-anchor="middle" fill="#e8ebff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">ADAPTIVE LEARNING</text>
    <rect x="350" y="0" width="105" height="34" rx="17" fill="#ffffff" fill-opacity=".1" stroke="#d7ddff" stroke-opacity=".28"/>
    <text x="402" y="22" text-anchor="middle" fill="#e8ebff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">RAG + AGENTS</text>
  </g>
  <g transform="translate(805 78)">
    <rect x="0" y="0" width="302" height="180" rx="22" fill="#fff" fill-opacity=".075" stroke="#dbe4ff" stroke-opacity=".3"/>
    <rect x="20" y="20" width="262" height="46" rx="12" fill="#fff" fill-opacity=".1"/>
    <circle cx="44" cy="43" r="10" fill="#7c8cff"/>
    <path d="M40 43 L44 47 L50 38" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="66" y="48" fill="#f2f4ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">Learner profile</text>
    <path d="M44 82 V112 H95 V140" stroke="#9aa7ff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-dasharray="4 5"/>
    <circle cx="44" cy="82" r="5" fill="#77e2ef"/>
    <rect x="95" y="120" width="170" height="40" rx="11" fill="url(#accent)"/>
    <text x="180" y="145" text-anchor="middle" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">Personalized tutor</text>
    <circle cx="44" cy="112" r="5" fill="#77e2ef"/>
  </g>
</svg>